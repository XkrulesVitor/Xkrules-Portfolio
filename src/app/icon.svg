    <radialGradient id="mtv" cx="60" cy="66" r="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff115e" stop-opacity=".45"/><stop offset="1" stop-color="#ff115e" stop-opacity="0"/></radialGradient>
    <linearGradient id="msh" x1="0" y1="0" x2="0" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
